name: cida-craft

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-health-defaults: &health_defaults
  interval: 10s
  timeout: 3s
  retries: 6

services:
  # One-shot migration pattern (implemented in P2): a dedicated short-lived
  # service runs drizzle-kit migrate against postgres and must exit 0;
  # api depends on it with `condition: service_completed_successfully`.
  # Never run migrations from application boot — replicas would race.

  postgres:
    image: postgres:16.15-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cida}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      <<: *health_defaults
      start_period: 15s
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
    logging: *logging

  valkey:
    image: valkey/valkey:8.1.9-alpine
    environment:
      TZ: UTC
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
    command:
      [
        'sh',
        '-c',
        'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --dir /data',
      ]
    volumes:
      - valkey_data:/data
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      TZ: UTC
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *health_defaults
      start_period: 20s
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
    logging: *logging

  gotenberg:
    build:
      context: ./gotenberg
    image: cida-local/gotenberg:8.36.0
    environment:
      TZ: UTC
    healthcheck:
      <<: *health_defaults
      start_period: 20s
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health || exit 1']
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      TZ: UTC
      SITE_URL: ${SITE_URL:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - admin_static:/srv/admin
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
    logging: *logging

  backup:
    image: alpine:3.23.5
    entrypoint: ['crond', '-f', '-l', '8']
    environment:
      TZ: UTC
    volumes:
      - ./backup/crontab:/etc/crontabs/root:ro
      - ./backup/scripts:/opt/backup:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'pidof crond || exit 1']
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      TZ: UTC
      NODE_ENV: production
      API_URL: http://api:3000
    healthcheck:
      <<: *health_defaults
      start_period: 10s
      test: ['CMD-SHELL', 'node -e "process.exit(0)"']
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      TZ: UTC
      NODE_ENV: production
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cida-craft
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      start_period: 10s
      test: ['CMD-SHELL', 'node -e "process.exit(0)"']
    logging: *logging

volumes:
  pg_data:
  valkey_data:
  minio_data:
  caddy_data:
  caddy_config:
  backup_data:
  admin_static:
