name: cida-craft

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-health-defaults: &health_defaults
  interval: 10s
  timeout: 3s
  retries: 6

services:
  # One-shot migration pattern (implemented in P2): a dedicated short-lived
  # service runs drizzle-kit migrate against postgres and must exit 0;
  # api depends on it with `condition: service_completed_successfully`.
  # Never run migrations from application boot — replicas would race.

  postgres:
    image: postgres:16.15-alpine
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cida}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      <<: *health_defaults
      start_period: 15s
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
    logging: *logging

  valkey:
    image: valkey/valkey:8.1.9-alpine
    environment:
      TZ: UTC
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
    command:
      [
        'sh',
        '-c',
        'exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly yes --dir /data',
      ]
    volumes:
      - valkey_data:/data
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" ping | grep -q PONG']
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--address', ':9000', '--console-address', ':9001']
    environment:
      TZ: UTC
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      <<: *health_defaults
      start_period: 20s
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
    logging: *logging

  gotenberg:
    build:
      context: ./gotenberg
    image: cida-local/gotenberg:8.36.0
    environment:
      TZ: UTC
    healthcheck:
      <<: *health_defaults
      start_period: 20s
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health || exit 1']
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      TZ: UTC
      SITE_URL: ${SITE_URL:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - admin_static:/srv/admin
    depends_on:
      admin:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1']
    logging: *logging

  backup:
    build:
      context: ./backup
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-cida}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-cida-craft}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      KEEP_LOCAL: '7'
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      start_period: 5s
      test: ['CMD-SHELL', 'pidof crond || exit 1']
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      TZ: UTC
      NODE_ENV: production
      # adapter-node reads PORT; Caddy proxies the storefront at web:3001, so
      # leaving it at the adapter default (3000) would 502 every page.
      PORT: '3001'
      API_URL: http://api:3000
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      ORIGIN: ${SITE_URL:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *health_defaults
      start_period: 15s
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/ || exit 1']
    logging: *logging

  # One-shot: builds the admin SPA into the volume Caddy serves at /admin, then
  # exits. `restart: no` keeps compose from treating the clean exit as a crash.
  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      TZ: UTC
    restart: 'no'
    volumes:
      - admin_static:/srv/admin
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      TZ: UTC
      NODE_ENV: production
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cida-craft
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker has no HTTP port by design (P7), so liveness is "the Node
    # process that owns PID 1 is still there" — a BullMQ crash exits it.
    healthcheck:
      <<: *health_defaults
      start_period: 15s
      test: ['CMD-SHELL', 'pgrep -f apps/worker/dist/index.js >/dev/null || exit 1']
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      TZ: UTC
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-cida-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      APP_URL: ${APP_URL:?set in .env}
      SITE_URL: ${SITE_URL:?set in .env}
      GOTENBERG_URL: http://gotenberg:3000
      RECONCILIATION_PROVIDER: ${RECONCILIATION_PROVIDER:-fake}
      # Backend-selected rail inputs (precedence billpay -> promptpay -> bank).
      # Empty disables that rail; selectPaymentRail() resolves server-side.
      BILLER_COMP_CODE: ${BILLER_COMP_CODE:-}
      PROMPTPAY_NUMBER: ${PROMPTPAY_NUMBER:-}
      BANK_NAME: ${BANK_NAME:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      BANK_ACCOUNT_NO: ${BANK_ACCOUNT_NO:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *health_defaults
      start_period: 15s
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/healthz || exit 1']
    logging: *logging

  # One-shot migration service (shared by dev and prod): applies the forward-only
  # Drizzle migrations against postgres, must exit 0. api and worker gate on it
  # via service_completed_successfully. Never run migrations from app boot.
  migrate:
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
    environment:
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Catalogue + bootstrap-superadmin seed, on the migrate image so it needs no
  # bind mount or host toolchain. Profile-gated: `--profile seed up seed`.
  seed:
    profiles: ['seed']
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
    command: ['./node_modules/.bin/tsx src/seed.ts']
    environment:
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

volumes:
  pg_data:
  valkey_data:
  minio_data:
  caddy_data:
  caddy_config:
  backup_data:
  admin_static:
