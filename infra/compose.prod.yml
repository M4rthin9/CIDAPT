x-restart: &restart always

x-limits: &limits
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 256M

services:
  caddy:
    restart: *restart
    ports:
      - '${HTTP_PORT:-80}:80'
      - '443:443'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  postgres:
    restart: *restart
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1G

  valkey:
    restart: *restart
    <<: *limits

  minio:
    restart: *restart
    <<: *limits

  gotenberg:
    restart: *restart
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  backup:
    restart: *restart
    <<: *limits

  api:
    restart: *restart
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  web:
    restart: *restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  worker:
    restart: *restart
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # One-shot services: they exit, but a runaway build/migration must not be able
  # to starve the host either. Limits apply while the container runs.
  admin:
    <<: *limits

  migrate:
    <<: *limits
