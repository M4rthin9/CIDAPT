services:
  # One-shot migrations: must exit 0 before api ever starts (P4+ adds that
  # dependency with condition: service_completed_successfully).
  migrate:
    image: node:22.22-alpine3.23
    working_dir: /repo
    command:
      - sh
      - -c
      - corepack enable && corepack prepare pnpm@11.22.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @cida/db migrate
    environment:
      TZ: UTC
      CI: 'true'
      # pnpm cannot hardlink across filesystems (bind vs volume), so pin the
      # store inside the bind instead of a separate named volume.
      npm_config_store_dir: /repo/.pnpm-store
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
    volumes:
      - ..:/repo
      - db_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: ['tools']
    image: node:22.22-alpine3.23
    working_dir: /repo
    command:
      - sh
      - -c
      - corepack enable && corepack prepare pnpm@11.22.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @cida/db seed
    environment:
      TZ: UTC
      CI: 'true'
      npm_config_store_dir: /repo/.pnpm-store
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}
    volumes:
      - ..:/repo
      - db_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    ports:
      - '${HTTP_PORT:-80}:80'

  gotenberg:
    ports:
      - '127.0.0.1:3010:3000'

  minio:
    ports:
      - '127.0.0.1:9001:9001'

  mailpit:
    image: axllent/mailpit:v1.31.0
    environment:
      TZ: UTC
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8025/ || exit 1']

  bull-board:
    image: node:22.22-alpine3.23
    working_dir: /repo/apps/worker
    command:
      - sh
      - -c
      - corepack enable && corepack prepare pnpm@11.22.0 --activate && pnpm install --frozen-lockfile && pnpm board
    environment:
      TZ: UTC
      VALKEY_URL: redis://:changeme@valkey:6379
      BOARD_PORT: '3001'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ..:/repo
      - db_node_modules:/repo/node_modules

  pgweb:
    image: sosedoff/pgweb:0.17.0
    command: ['pgweb', '--bind=0.0.0.0', '--listen=8081']
    environment:
      TZ: UTC
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cida}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8081/ || exit 1']

volumes:
  mailpit_data:
  db_node_modules:
